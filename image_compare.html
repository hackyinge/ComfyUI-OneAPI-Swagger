<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ComfyUI · 中文生图对比</title><style>
:root{font-family:system-ui,sans-serif;color:#202c40;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:24px;background:white;border-bottom:1px solid #dce2eb;padding:20px 5vw}a{color:#305cf5;text-decoration:none}header strong{margin-right:auto}main{max-width:1400px;margin:auto;padding:32px 5vw}h1{margin:0 0 8px;font-size:32px}h2{margin-top:32px}p{line-height:1.7;color:#586579}.notice{padding:18px 22px;background:#edf2ff;border:1px solid #cad7ff;border-radius:12px;line-height:1.8;white-space:pre-line}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid #dce2eb;border-radius:12px}article h3{margin:0 0 12px;font-size:18px}.tag{font-size:12px;padding:4px 8px;background:#eef2fa;border-radius:5px}.metrics{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:#586579;margin:14px 0}.text{min-height:48px;line-height:1.7}audio{width:100%;margin-top:12px}.table{overflow:auto;background:white;border:1px solid #dce2eb;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #e9edf3;font-size:14px;vertical-align:top}th{background:#eef2f7;white-space:nowrap}.transcript{min-width:270px;line-height:1.7}.error{color:#a52222}details{margin:10px 0;font-size:13px;color:#586579}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{margin:32px 0;color:#586579;font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}header{gap:12px;font-size:13px}main{padding:24px 16px}h1{font-size:26px}}
.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0}.filters select{border:1px solid #ccd5e4;border-radius:8px;padding:9px;background:white;font:inherit}.phase{display:block;margin-top:8px;font-size:12px;color:#586579}.timing{white-space:pre-line;font-variant-numeric:tabular-nums;min-width:125px}.gain{color:#167043;font-weight:600}

.recommended{border-color:#8faaff}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:8px;margin-bottom:16px}select{max-width:100%}article{min-width:0}.review{white-space:pre-line}header{flex-wrap:wrap}.references{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.references img{aspect-ratio:1;object-fit:contain;margin:4px 0}.references figcaption{font-size:12px;color:#586579}.references a{min-width:0}summary{cursor:pointer}button{font:inherit;cursor:pointer}</style></head><body><header><strong>ComfyUI / 中文生图实验室</strong><a href="/oneapi/v1/video/compare">视频</a><a href="/oneapi/v1/audio/compare">语音</a><a href="/oneapi/docs">OneAPI ↗</a></header><main><h1>中文生图与多图参考对比</h1><p>成片统一1024×1024 · 单组相同提示词与 seed · 点击图片查看原尺寸</p><details><summary>测试条件、缓存与补充实验</summary><p id="protocol"></p></details><div id="recommendation" class="notice">正在读取实测结果…</div><details><summary>大图上传、代理与服务响应实测</summary><p id="upload-summary"></p><pre id="upload-evidence"></pre></details><p id="error" role="alert"></p><div class="filters"><label>实验 <select id="phase"><option value="mixed_content">OpenAI：图文混排 / SSE / 大图</option><option value="multi_reference">双模型：1 / 2 / 3 / 9张参考图</option><option value="reference_inputs">本轮参考原图与编号</option><option value="turbo_steps">Turbo：4 / 6 / 8步与25步</option><option value="turbo_coldwarm">默认接口：首次完整加载 / 连续调用</option><option value="turbo_edit">默认Turbo：参考图编辑</option><option value="turbo_warmup">Turbo：首次加载与预热</option><option value="controlled_1024">主对照：连续入队 / 同提示词</option><option value="matched_1024">补充：交错调用 / 同提示词</option><option value="all">全部历史测试（含已下架模型）</option></select></label><label>场景 <select id="case"><option value="all">全部场景</option><option value="poster">茶会海报</option><option value="sign">书店招牌与数字</option><option value="1refs">1张参考图</option><option value="2refs">2张参考图</option><option value="3refs">3张参考图</option><option value="9refs">9张参考图</option></select></label><label>Seed <select id="seed"><option value="all">全部 seed</option><option>20261024</option><option>20261025</option><option>20261028</option><option>20261030</option><option>20261031</option><option>20261032</option></select></label><span id="count"></span></div><section id="grid" class="grid"></section><footer><p id="license"></p>耗时为服务端执行时间，含本次实际加载与保存，不含排队；缓存条件见逐条证据。GPU总显存每100ms采样，包含CUDA上下文与可能保留的其他模型，不能当作模型参数大小。未采样记录显示“未测”。视觉结论为逐图人工核对，非榜单量化版分数。<a href="/oneapi/v1/images/comparison">完整数据 JSON ↗</a></footer></main><script>
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n},$=id=>document.getElementById(id);let data;
function render(){const rows=data.records.filter(r=>($('phase').value==='all'||!r.retired&&r.phase===$('phase').value)&&($('case').value==='all'||r.case===$('case').value)&&($('seed').value==='all'||String(r.options.seed)===$('seed').value));rows.sort((a,b)=>(a.case||'').localeCompare(b.case||'')||a.options.seed-b.options.seed||({8:0,25:1,6:2,4:3}[a.steps]??4)-({8:0,25:1,6:2,4:3}[b.steps]??4)||b.options.model.localeCompare(a.options.model));$('grid').replaceChildren();$('count').textContent=rows.length+' 张';
for(const r of rows){const card=el('article',undefined,r.recommended?'recommended':undefined),link=el('a'),img=el('img');link.href=r.image_url;link.target='_blank';link.rel='noopener';img.src=r.image_url;img.alt=r.title||r.options.model+' / '+(r.case||r.id);img.loading='lazy';link.append(img);card.append(el('h2',r.title||(r.options.model+' · '+r.steps+'步'+(r.recommended?'（默认）':'')+(r.retired?'（已下架）':''))),link);
if(r.phase==='reference_inputs'){card.append(el('p',r.assessment,'review'));$('grid').append(card);continue}
card.append(el('span',r.quantization||'INT8 ConvRot','tag'));card.append(el('p',r.execution_seconds.toFixed(3)+' 秒 · '+r.options.width+'×'+r.options.height+' · seed '+r.options.seed));card.append(el('p',r.steps+'步 · CFG '+r.cfg+' · '+(r.reference_count?r.reference_count+'张参考图':r.case==='poster'?'茶会海报':r.case==='sign'?'书店招牌':'探索记录')));
if(r.request_seconds)card.append(el('p','接口总等待 '+r.request_seconds.toFixed(3)+' 秒（含上传、排队及返回；与执行耗时分开）'));
card.append(el('p','文字条件：'+(r.cached_nodes?.includes('condition')?'复用缓存':'本次编码')+'；GPU权重复用 '+((r.gpu_pool?.reusable_bytes||0)/1024**3).toFixed(2)+' GiB'));card.append(el('p','GPU总显存峰值'+(r.gpu_measurement_scope==='request_window'?'（请求窗口，含排队）':'')+'：'+(Number.isFinite(r.gpu_total_peak_mb)?(r.gpu_total_peak_mb/1024).toFixed(2)+' GiB（'+r.gpu_samples+'次采样）':'未测')));card.append(el('p',r.assessment||'待评估','review'));
if(r.reference_ids?.length){const sources=el('details');sources.append(el('summary','参考图顺序与绑定（'+r.reference_ids.length+'张）'));const thumbs=el('div',undefined,'references');for(let i=0;i<r.reference_ids.length;i++){const source=data.records.find(x=>x.id===r.reference_ids[i]);if(!source)continue;const figure=el('figure'),a=el('a'),image=el('img');a.href=source.image_url;a.target='_blank';a.rel='noopener';image.src=source.image_url;image.loading='lazy';image.alt='参考图'+(i+1);a.append(image);figure.append(a,el('figcaption','图'+(i+1)+' / '+(r.reference_map?.[i]?.id||'image'+(i+1))));thumbs.append(figure)}sources.append(thumbs);card.append(sources)}
const details=el('details');details.append(el('summary','提示词、参数与执行证据'),el('pre',JSON.stringify({prompt:r.options.prompt,steps:r.steps||r.options.steps,cfg:r.cfg,job_id:r.job_id,phase:r.phase,reference_map:r.reference_map,protocol_note:r.protocol_note,request_bytes:r.request_bytes,first_stream_event_seconds:r.first_stream_event_seconds,gpu_measurement_scope:r.gpu_measurement_scope,upload_fixtures:r.upload_fixtures,experimental:r.experimental,unet:r.unet,sigmas:r.sigmas,cached_nodes:r.cached_nodes,gpu_pool:r.gpu_pool},null,2)));card.append(details);$('grid').append(card)}}
fetch('/oneapi/v1/images/comparison').then(async r=>{if(!r.ok)throw Error('读取失败：HTTP '+r.status);return r.json()}).then(d=>{data=d;$('phase').value=d.default_experiment||'controlled_1024';$('protocol').textContent=d.protocol;$('recommendation').textContent=d.summary||d.recommendation;$('license').textContent=d.license||'';$('upload-summary').textContent=d.upload_summary||'暂无大包测试';$('upload-evidence').textContent=JSON.stringify(d.upload_test||{},null,2);for(const id of ['phase','case','seed'])$(id).onchange=render;render()}).catch(e=>{$('error').textContent=e.message});</script></body></html>
